# Model provider configuration
# This file defines the available model providers and their settings

providers:
  aicloud:
    api_key_env: "AICLOUD_API_KEY"
    base_url: "https://aicloud.oneainexus.cn:30013/inference/gpt-oss-120b/v1"
    description: "AICloud provider for gpt-oss-120b model"
    default_models:
      query_generator: "gpt-oss-120b"
      reflection: "gpt-oss-120b"
      answer: "gpt-oss-120b"
    supports_structured_output: true
    supports_tools: true
    max_retries: 2
